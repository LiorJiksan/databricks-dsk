# The main pipeline for DSK

resources:
  pipelines:
    DSK_etl:
      name: DSK_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/DSK_etl"

      libraries:
        - glob:
            include: ../src/DSK_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
